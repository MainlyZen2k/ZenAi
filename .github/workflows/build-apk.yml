name: Build Zen AI APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Locate the app code (unzip the project zip)
        run: |
          if [ -f ZenAI-Expo.zip ]; then
            echo "Found ZenAI-Expo.zip — extracting..."
            unzip -oq ZenAI-Expo.zip
          elif [ "$(ls ./*.zip 2>/dev/null | wc -l)" -eq 1 ]; then
            echo "No ZenAI-Expo.zip, but exactly one zip found — using it..."
            unzip -oq ./*.zip
          fi
          APP_DIR=""
          for f in $(find . -maxdepth 3 -name app.json -not -path './.git/*' -not -path '*/node_modules/*'); do
            if grep -q '"expo"' "$f"; then APP_DIR="$(dirname "$f")"; break; fi
          done
          if [ -z "$APP_DIR" ]; then
            echo "::error::No Expo project found in this repo. Upload ZenAI-Expo.zip to the top level of the repo (or the extracted files: package.json, App.tsx, app.json, eas.json, assets/)."
            exit 1
          fi
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Building from folder: $APP_DIR"

      # Keep the same signing key between builds. Without this, every new
      # APK would have a different signature and Android would refuse to
      # update the app over the old one (you'd have to uninstall first).
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/zen-keystore
          key: zen-signing-key

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub runners already ship the Android SDK with licenses
      # pre-accepted. The android-actions/setup-android helper re-downloads
      # tools from Google and is flaky, so we skip it and just run a
      # retrying license check that can never block the build.
      - name: Accept Android SDK licenses (preinstalled SDK)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          n=0
          until yes | "$SDKM" --licenses >/dev/null 2>&1; do
            n=$((n+1))
            if [ $n -ge 3 ]; then
              echo "License check kept failing — continuing anyway, licenses are pre-accepted on GitHub runners."
              exit 0
            fi
            echo "Attempt $n failed, retrying in 15s..."
            sleep 15
          done
          echo "Licenses OK"

      # Pre-install the exact SDK components the Expo build needs (Gradle
      # would fetch them itself, but doing it here gives us retries and
      # readable logs if Google's servers hiccup).
      - name: Install Android SDK components (Expo SDK 52)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          n=0
          until yes | "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125" >/dev/null 2>&1; do
            n=$((n+1))
            if [ $n -ge 3 ]; then
              echo "Final attempt, shown in full for the log:"
              yes | "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125" | tail -25 || true
              echo "::error::Could not download Android SDK components after 3 tries. Re-run the workflow once — if it fails again, send the log."
              exit 1
            fi
            echo "SDK download attempt $n failed — retrying in 15s..."
            sleep 15
          done
          echo "SDK components ready:"
          "$SDKM" --list_installed 2>/dev/null | grep -E "platforms;|build-tools;|ndk;" | head -10 || true

      # Reuses Gradle downloads between builds (big speed-up)
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install JavaScript dependencies
        run: cd "$APP_DIR" && npm install --no-audit --no-fund

      - name: Generate native Android project
        run: cd "$APP_DIR" && npx expo prebuild --platform android --no-install

      - name: Reuse the saved signing key
        run: |
          mkdir -p "$APP_DIR/android/app"
          if [ -f ~/zen-keystore/debug.keystore ]; then
            cp ~/zen-keystore/debug.keystore "$APP_DIR/android/app/debug.keystore"
            echo "Reusing previous signing key"
          fi

      - name: Build the APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Save the signing key for next builds
        run: |
          mkdir -p ~/zen-keystore
          cp "$APP_DIR/android/app/debug.keystore" ~/zen-keystore/debug.keystore

      - name: Rename APK
        run: cp "$APP_DIR/android/app/build/outputs/apk/release/app-release.apk" Zen-AI.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zen-AI-APK
          path: Zen-AI.apk
          retention-days: 30
