name: Build Zen AI APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Keep the same signing key between builds. Without this, every new
      # APK would have a different signature and Android would refuse to
      # update the app over the old one (you'd have to uninstall first).
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/zen-keystore
          key: zen-signing-key

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # We do NOT use android-actions/setup-android here: GitHub runners
      # already ship the Android SDK with licenses pre-accepted, and that
      # action is flaky (it re-downloads cmdline-tools from Google and can
      # die on "Fetching remote repository"). This step is just a safety
      # net that retries and never blocks the build.
      - name: Accept Android SDK licenses (preinstalled SDK)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "Using preinstalled sdkmanager: $SDKM"
          n=0
          until yes | "$SDKM" --licenses >/dev/null 2>&1; do
            n=$((n+1))
            if [ $n -ge 3 ]; then
              echo "License check kept failing — continuing anyway, licenses are pre-accepted on GitHub runners."
              exit 0
            fi
            echo "Attempt $n failed, retrying in 15s..."
            sleep 15
          done
          echo "Licenses OK"

      # Reuses Gradle downloads between builds (big speed-up)
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Reuse the saved signing key
        run: |
          mkdir -p android/app
          if [ -f ~/zen-keystore/debug.keystore ]; then
            cp ~/zen-keystore/debug.keystore android/app/debug.keystore
            echo "Reusing previous signing key"
          fi

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Save the signing key for next builds
        run: |
          mkdir -p ~/zen-keystore
          cp android/app/debug.keystore ~/zen-keystore/debug.keystore

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Zen-AI.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zen-AI-APK
          path: Zen-AI.apk
          retention-days: 30
